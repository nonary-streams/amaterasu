[package]
name = "amaterasu-vkms-frame-helper"
description = "Unprivileged wire protocol and channel for the VKMS frame helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
driver-read-leases = []

# The library holds only the unprivileged wire protocol and descriptor channel
# shared with the capture module. The provider builds the privileged binary.
[lib]
name = "amaterasu_vkms_frame_helper"
path = "src/lib.rs"

# libc is already in the workspace lock and provides the raw Linux syscalls,
# ioctls and SCM_RIGHTS control-message helpers this crate needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
