[package]
name = "example-application-library-provider"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
base64 = "0.22"
amaterasu-runtime = { path = "../../../runtime" }
amaterasu-contracts = { path = "../../../contracts" }
amaterasu-launch = { path = "../../../../modules/launch" }
example-application-library-v2 = { path = "../application-library-v2", features = ["embedded"] }
libloading = "0.8"
