[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/data-plane",
    "crates/configuration-schema",
    "crates/extension-api",
    "crates/media",
    "crates/windows-capture-geometry",
    "crates/identity",
    "crates/gamestream",
    "crates/input-policy",
    "crates/network-policy",
    "crates/network-api",
    "crates/rtx-runtime",
    "crates/network-sockets",
    "modules/network",
    "crates/webrtc-transport",
    "crates/logging",
    "crates/contracts",
    "crates/input-companion",
    "crates/runtime",
    "crates/package",
    "crates/capture-authority",
    "crates/storage",
    "crates/module-sdk",
    "crates/host",
    "crates/release",
    "crates/vkms-frame-helper",
    "fixtures/echo",
    "fixtures/data-plane",
    "fixtures/extension-example",
    "fixtures/media-probe",
    "fixtures/autonomous-video-probe",
    "fixtures/stream-source",
    "fixtures/capture-source",
    "fixtures/encoder-source",
    "fixtures/input-probe",
    "modules/state",
    "modules/session",
    "modules/session-lifecycle",
    "modules/extension-actions",
    "modules/extension-registry",
    "modules/configuration",
    "modules/host-configuration",
    "modules/catalog",
    "modules/library",
    "modules/application",
    "modules/diagnostics",
    "modules/steam",
    "modules/playnite",
    "modules/lutris",
    "modules/authentication",
    "modules/management",
    "modules/pairing",
    "modules/nvhttp",
    "modules/display",
    "modules/launch",
    "modules/input",
    "modules/virtual-display",
    "modules/capture-dxgi",
    "modules/capture-pipewire",
    "modules/capture-kms",
    "modules/capture-wgc",
    "modules/capture-x11",
    "modules/audio",
    "modules/audio-encode",
    "modules/media-transport",
    "modules/control-transport",
    "modules/stream-session",
    "modules/stats/history",
    "modules/stats",
    "modules/foreground-context",
    "modules/updater",
    "modules/system-tray",
    "modules/rtsp",
    "modules/upnp",
    "modules/encode",
    "modules/video",
    "modules/frame-limiter",
    "modules/rtx-hdr",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-network-api = { path = "crates/network-api" }
amaterasu-network-sockets = { path = "crates/network-sockets" }
amaterasu-data-plane = { path = "crates/data-plane" }
amaterasu-configuration-schema = { path = "crates/configuration-schema" }
amaterasu-extension-api = { path = "crates/extension-api" }
amaterasu-abi = { path = "crates/abi" }
amaterasu-media = { path = "crates/media" }
amaterasu-windows-capture-geometry = { path = "crates/windows-capture-geometry" }
amaterasu-identity = { path = "crates/identity" }
amaterasu-gamestream = { path = "crates/gamestream" }
amaterasu-input-policy = { path = "crates/input-policy" }
amaterasu-network-policy = { path = "crates/network-policy" }
amaterasu-logging = { path = "crates/logging" }
amaterasu-contracts = { path = "crates/contracts" }
amaterasu-input-companion = { path = "crates/input-companion" }
amaterasu-package = { path = "crates/package" }
amaterasu-module-sdk = { path = "crates/module-sdk" }
amaterasu-storage = { path = "crates/storage" }
amaterasu-updater = { path = "modules/updater" }
amaterasu-system-tray = { path = "modules/system-tray" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sha2 = "0.10"
regex = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
httparse = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
