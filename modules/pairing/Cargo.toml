[package]
name = "amaterasu-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amaterasu-pairing-import"
path = "src/bin/amaterasu-pairing-import.rs"

[dependencies]
amaterasu-input-policy.workspace = true
amaterasu-module-sdk.workspace = true
amaterasu-identity.workspace = true
amaterasu-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["oid"] }
getrandom.workspace = true
rsa = { version = "0.9.8", features = ["sha2"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
aes = "0.8.4"
subtle = "2.6"

[dev-dependencies]
amaterasu-contracts.workspace = true
amaterasu-runtime = { path = "../../crates/runtime" }
amaterasu-nvhttp = { path = "../nvhttp", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
