[package]
name = "amaterasu-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Produces an isolated qualification artifact with no native input backend.
qualification-fake-backend = []
# A second independently implemented, device-free qualification backend.
qualification-alternate-backend = []

[dependencies]
amaterasu-contracts.workspace = true
amaterasu-extension-api.workspace = true
amaterasu-configuration-schema.workspace = true
amaterasu-module-sdk.workspace = true
amaterasu-gamestream.workspace = true
amaterasu-input-policy.workspace = true
amaterasu-input-companion.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = {
    version = "0.61",
    features = [
        "Win32_Foundation",
        "Win32_System_LibraryLoader",
        "Win32_UI_Controls",
        "Win32_UI_Input_KeyboardAndMouse",
        "Win32_UI_Input_Pointer",
        "Win32_UI_WindowsAndMessaging",
    ],
}

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
amaterasu-runtime = { path = "../../crates/runtime" }
