[package]
name = "amaterasu-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amaterasu-module-sdk = { workspace = true, features = ["network-http"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
getrandom.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
amaterasu-module-sdk = { workspace = true, features = ["network-test-support"] }

[lints]
workspace = true
