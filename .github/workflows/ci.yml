name: Rust components

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize pinned core plugins
        run: git submodule update --init --recursive
      - uses: actions/checkout@v7
        if: runner.os == 'Linux'
        with:
          repository: Nonary/vibeshine
          ref: 457237db7e57f9c4be21c35bb07e28d1c100eb7d
          path: reference/vibeshine
          persist-credentials: false
      - name: Install Linux capture build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev pkg-config
      - name: Check VKMS shared wire sources
        run: python scripts/check_vkms_wire_sync.py
      - name: Configuration inventory coverage
        if: runner.os == 'Linux'
        env:
          AMATERASU_VIBESHINE_REFERENCE: reference/vibeshine
        run: python scripts/inventory_configuration.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --all --check
      - run: cargo test --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --locked
      - run: cargo clippy --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path modules/capture-vkms/capture/Cargo.toml --all --check
      - run: cargo test --manifest-path modules/capture-vkms/capture/Cargo.toml --locked
      - run: cargo clippy --manifest-path modules/capture-vkms/capture/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test capture with Linux features
        if: runner.os == 'Linux'
        run: cargo test --manifest-path modules/capture-vkms/capture/Cargo.toml --locked --all-features
      - name: Lint capture with Linux features
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path modules/capture-vkms/capture/Cargo.toml --locked --all-features --all-targets -- -D warnings
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python scripts/test_component_updates.py
      - run: python scripts/test_platform_modules.py
      - run: python scripts/test_host_service.py
      - run: python scripts/test_management_api.py
      - name: C ABI layout
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -Isdk/include scripts/check_abi.c -o target/check-abi && target/check-abi
      - name: Media C ABI layout
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Isdk/include sdk/tests/media_layout.c
      - name: C SDK logging
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -Isdk/include sdk/tests/logging.c -o target/check-sdk-logging && target/check-sdk-logging
