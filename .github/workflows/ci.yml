name: Rust components

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Signed native fixtures hash every library before startup. Debug symbols
      # add gigabytes without changing the behavior these checks exercise.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the Windows integration token
        if: runner.os == 'Windows'
        run: python scripts/run_native_integration.py --verify-token
      - name: Initialize pinned core plugins
        run: git submodule update --init --recursive
      - uses: actions/checkout@v7
        if: runner.os == 'Linux'
        with:
          repository: Nonary/vibeshine
          ref: 457237db7e57f9c4be21c35bb07e28d1c100eb7d
          path: reference/vibeshine
          persist-credentials: false
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libpulse-dev libpipewire-0.3-dev libglib2.0-dev pkg-config
          pkg-config --exists libpipewire-0.3 gio-2.0 gio-unix-2.0
      - name: Check VKMS shared wire sources
        run: python scripts/check_vkms_wire_sync.py
      - name: Configuration inventory coverage
        if: runner.os == 'Linux'
        env:
          AMATERASU_VIBESHINE_REFERENCE: reference/vibeshine
        run: python scripts/inventory_configuration.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --all --check
      - run: cargo test --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --locked
      - run: cargo clippy --manifest-path modules/capture-vkms/helper-wire/Cargo.toml --all-targets --locked -- -D warnings
      - name: Use the host workspace's VKMS dependency lock
        run: cp scripts/locks/capture-vkms-host.lock modules/capture-vkms/capture/Cargo.lock
      - run: cargo fmt --manifest-path modules/capture-vkms/capture/Cargo.toml --all --check
      - run: cargo test --manifest-path modules/capture-vkms/capture/Cargo.toml --locked
      - run: cargo clippy --manifest-path modules/capture-vkms/capture/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test capture with Linux features
        if: runner.os == 'Linux'
        run: cargo test --manifest-path modules/capture-vkms/capture/Cargo.toml --locked --all-features
      - name: Lint capture with Linux features
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path modules/capture-vkms/capture/Cargo.toml --locked --all-features --all-targets -- -D warnings
      - name: Format stream failure audit
        run: cargo fmt --manifest-path scripts/stream-failure-audit/Cargo.toml --check
      - name: Test stream failure audit fixtures
        run: cargo test --manifest-path scripts/stream-failure-audit/Cargo.toml --locked -- --nocapture
      - name: Lint stream failure audit
        run: cargo clippy --manifest-path scripts/stream-failure-audit/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test stream rejection scenarios against the checkout
        run: python scripts/test_summarize_stream_failures.py
      - name: Use the canonical temporary path for macOS test fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          temp_path=$(cd "${TMPDIR:-/tmp}" && pwd -P)
          printf 'TMPDIR=%s\n' "$temp_path" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Test Rust workspace
        id: workspace_tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Lint Rust workspace
        if: success() || (failure() && steps.workspace_tests.outcome == 'failure')
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - run: python scripts/run_native_integration.py test_component_updates.py
      - run: python scripts/run_native_integration.py test_platform_modules.py
      - run: python scripts/run_native_integration.py test_host_service.py
      - run: python scripts/run_native_integration.py test_management_api.py
      - name: C ABI layout
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -Isdk/include scripts/check_abi.c -o target/check-abi && target/check-abi
      - name: Media C ABI layout
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Isdk/include sdk/tests/media_layout.c
      - name: C SDK logging
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Werror -Isdk/include sdk/tests/logging.c -o target/check-sdk-logging && target/check-sdk-logging
