[package]
name = "amaterasu-stream-failure-audit"
version = "0.1.0"
edition = "2024"
publish = false

# Keep analysis tooling out of production host/module dependency graphs.
[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
